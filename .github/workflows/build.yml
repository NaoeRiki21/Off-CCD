name: Build Off-CCD EXE with Logo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AHK v2 and Compiler (Fixed Link)
        shell: pwsh
        run: |
          # 1. 创建并进入工具目录
          $toolsDir = New-Item -ItemType Directory -Force -Path ".\ahk_tools"
          
          # 2. 下载 AutoHotkey v2.0.11 (固定版本，最稳)
          Write-Host "Downloading AutoHotkey v2..."
          $ahkUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.11/AutoHotkey_2.0.11.zip"
          Invoke-WebRequest -Uri $ahkUrl -OutFile "$toolsDir\ahk.zip" -UseBasicParsing
          Expand-Archive -Path "$toolsDir\ahk.zip" -DestinationPath "$toolsDir\ahk_runtime"

          # 3. 下载 Ahk2Exe 编译器 v1.1.37.02 (固定版本)
          Write-Host "Downloading Ahk2Exe Compiler..."
          $compilerUrl = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/v1.1.37.02/Ahk2Exe.zip"
          Invoke-WebRequest -Uri $compilerUrl -OutFile "$toolsDir\compiler.zip" -UseBasicParsing
          
          # 创建编译器专门目录并解压
          $compilerDir = New-Item -ItemType Directory -Force -Path "$toolsDir\ahk_runtime\Compiler"
          Expand-Archive -Path "$toolsDir\compiler.zip" -DestinationPath $compilerDir

      - name: Compile Script
        shell: pwsh
        run: |
          # 定义路径
          $toolsDir = ".\ahk_tools"
          $compiler = "$toolsDir\ahk_runtime\Compiler\Ahk2Exe.exe"
          $baseExe = "$toolsDir\ahk_runtime\v2\AutoHotkey64.exe"
          
          # 如果解压结构不同，尝试另一个路径
          if (-not (Test-Path $baseExe)) { $baseExe = "$toolsDir\ahk_runtime\AutoHotkey64.exe" }

          Write-Host "Using Compiler: $compiler"
          Write-Host "Using Base EXE: $baseExe"

          # 执行编译
          if (Test-Path "logo.ico") {
            & $compiler /in "Off-CCD.ahk" /out "Off-CCD.exe" /icon "logo.ico" /base $baseExe /compress 0
          } else {
            & $compiler /in "Off-CCD.ahk" /out "Off-CCD.exe" /base $baseExe /compress 0
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Off-CCD-v1.0
          path: Off-CCD.exe
