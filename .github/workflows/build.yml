name: Build Off-CCD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # 必须在 Windows 环境下编译

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AHK2Exe GitHub Action
        uses: MohamedSaidSallam/AHK2Exe-GitHub-Action@v1
        with:
          # 脚本入口文件
          in: Off-CCD.ahk
          # 输出文件名
          out: Off-CCD.exe
          # 指定图标文件
          icon: logo.ico
          # 指定 AHK 版本 (默认就是 v2.0.19，符合你的代码)
          ahk_version_tag: v2.0.19

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Off-CCD-v1.0
          path: Off-CCD.exe
