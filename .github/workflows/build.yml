name: Build Off-CCD EXE with Logo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AutoHotkey
        uses: mmulthaupt/setup-autohotkey@v2
        with:
          version: '2.0'

      - name: Compile Script
        shell: pwsh
        run: |
          $ahkDir = Join-Path $env:ProgramFiles "AutoHotkey"
          $compiler = Get-ChildItem -Path $ahkDir -Filter "Ahk2Exe.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          
          if ($null -eq $compiler) {
            Write-Error "Could not find Ahk2Exe.exe!"
            exit 1
          }

          if (Test-Path "logo.ico") {
            & $compiler /in "Off-CCD.ahk" /out "Off-CCD.exe" /icon "logo.ico" /compress 0
          } else {
            & $compiler /in "Off-CCD.ahk" /out "Off-CCD.exe" /compress 0
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Off-CCD-EXE
          path: Off-CCD.exe
