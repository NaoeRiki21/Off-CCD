name: Build Off-CCD EXE with Logo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AHK v2 and Compiler
        shell: pwsh
        run: |
          # 创建工具目录
          New-Item -ItemType Directory -Force -Path ".\tools"

          # 1. 下载 AutoHotkey v2 运行环境 (v2.0.11)
          Write-Host "Downloading AutoHotkey v2..."
          Invoke-WebRequest -Uri "https://www.autohotkey.com/download/ahk-v2.zip" -OutFile ".\tools\ahk-v2.zip"
          Expand-Archive -Path ".\tools\ahk-v2.zip" -DestinationPath ".\tools\ahk"

          # 2. 从官方仓库下载 Ahk2Exe 编译器
          Write-Host "Downloading Ahk2Exe Compiler..."
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/latest/download/Ahk2Exe.zip" -OutFile ".\tools\Ahk2Exe.zip"
          Expand-Archive -Path ".\tools\Ahk2Exe.zip" -DestinationPath ".\tools\ahk\Compiler"

      - name: Compile Script
        shell: pwsh
        run: |
          $compiler = ".\tools\ahk\Compiler\Ahk2Exe.exe"
          $baseExe = ".\tools\ahk\AutoHotkey64.exe"  # 指定 64 位 v2 作为底包

          Write-Host "Compiling Off-CCD.ahk..."
          
          # 判断是否有图标
          if (Test-Path "logo.ico") {
            & $compiler /in "Off-CCD.ahk" /out "Off-CCD.exe" /icon "logo.ico" /base $baseExe /compress 0
          } else {
            & $compiler /in "Off-CCD.ahk" /out "Off-CCD.exe" /base $baseExe /compress 0
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Off-CCD-Windows-EXE
          path: Off-CCD.exe
